[ut_shannon(1)]
args = word
definition = lookup ut_shannon_lookup word as $word$

[ut_parse_extended(2)]
args = url, list
definition = lookup ut_parse_extended_lookup url as $url$ list as $list$ | spath input=ut_subdomain_parts | fields - ut_subdomain_parts

[ut_parse_simple(1)]
args = url
definition = lookup ut_parse_simple_lookup url as $url$

[ut_parse(2)]
args = url, list
definition = `ut_parse_extended($url$, $list$)`

[ut_unwrap(1)]
args = url
definition = lookup ut_unwrap url as $url$

[ut_meaning(1)]
args = word
definition = lookup ut_meaning_lookup word as $word$

[ut_suites(2)]
args = word, set
definition = lookup ut_suites_lookup word as $word$ set as $set$ | spath input=ut_suites | fields - ut_suites 

[ut_countset(2)]
args = word, set
definition = lookup ut_countset_lookup word as $word$ set as $set$

[ut_bayesian(1)]
args = word
definition = lookup ut_bayesian_lookup word as $word$

[ut_levenshtein(2)]
args = w1, w2
definition = lookup ut_levenshtein_lookup word1 as $w1$ word2 as $w2$

[ut_parse_domain(2)]
args = domain, lookup
definition = eval ut_domains_tmp=mvappend('$domain$', "") | foreach mode=multivalue ut_domains_tmp [ eval ut_d_tmp = case(match('<<ITEM>>', "^[^.]"), lower('<<ITEM>>')) , ut_dth_tmp = json_extract(lookup("$lookup$", json_object("domain_wc", ut_d_tmp), json_array("match_depth")), "match_depth") , ut_ds_tmp = split(ut_d_tmp, ".") , ut_len_tmp = mvcount(ut_ds_tmp) , ut_dp_tmp = case(ut_len_tmp>=ut_dth_tmp, mvindex(ut_ds_tmp, -1*(ut_dth_tmp), -1)) , ut_d_tmp = mvjoin(ut_dp_tmp, ".") , ut_tld_tmp = mvjoin(mvindex(ut_dp_tmp, 1, -1), ".") , ut_no_tld_tmp = mvindex(ut_dp_tmp, 0) , ut_subparts_tmp = case(ut_len_tmp>=ut_dth_tmp, mvindex(ut_ds_tmp, 0, -1*(ut_dth_tmp+1))) , ut_sub_cnt_tmp = tostring(mvcount(ut_subparts_tmp)) , ut_sub_tmp = mvjoin(ut_subparts_tmp, ".") , ut_results = if(isnotnull(ut_d_tmp), mvappend(ut_results, json_object("ut_domain", ut_d_tmp, "ut_tld", ut_tld_tmp, "ut_domain_without_tld", ut_no_tld_tmp, "ut_subdomain", ut_sub_tmp, "ut_subdomain_count", ut_sub_cnt_tmp, "ut_subdomain_parts", if(ut_sub_cnt_tmp>1, ut_subparts_tmp, json_array(ut_subparts_tmp)))), ut_results) ] | fields - ut_*_tmp
validation = match(lookup, "^ut_psl_lookup")

[ut_parse_domain(1)]
definition = `ut_parse_domain($domain$, "ut_psl_lookup")`

[ut_parse_domain_icann(1)]
args = domain
definition = `ut_parse_domain($domain$, "ut_psl_lookup_icann")`
